# Builds the image after CI passes on main, or by hand, and pushes it to the app's registry (Q-K10).
# Rolling it out is a dev's step (scripts/rollout_azure.sh): team accounts can't grant GitHub a role
# on the resource group, so GitHub only holds the registry's push login. Details: docs/deploy.md.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-azure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: azure-demo
    env:
      REGISTRY: ${{ vars.ONKO_ACR_SERVER }}
      APP: ${{ vars.ONKO_AZ_APP || 'onko-koordinace' }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - name: Fail if the registry settings are missing
        run: |
          test -n "$REGISTRY" || { echo "::error::set the ONKO_ACR_SERVER variable on the azure-demo environment"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ONKO_ACR_SERVER }}
          username: ${{ secrets.ONKO_ACR_USERNAME }}
          password: ${{ secrets.ONKO_ACR_PASSWORD }}
      - name: Build and push the image
        run: |
          image="$REGISTRY/$APP:main-$SHA"
          docker build --tag "$image" .
          docker push "$image"
          {
            echo "Pushed \`$image\`. Roll it out:"
            echo '```bash'
            echo "./scripts/rollout_azure.sh main-$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
