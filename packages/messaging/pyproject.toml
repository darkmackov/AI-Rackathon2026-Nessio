[project]
name = "onko-messaging"
version = "0.1.0"
description = "Requests, MDT result delivery, reviewing-doctor feed, receipts."
requires-python = ">=3.11"
dependencies = ["onko-contracts"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onko_messaging"]
