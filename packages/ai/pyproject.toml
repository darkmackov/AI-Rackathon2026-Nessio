[project]
name = "onko-ai"
version = "0.1.0"
description = "Handover extraction with evidence, completeness/consistency checks, drafting."
requires-python = ">=3.11"
dependencies = ["onko-contracts", "onko-llm-gateway"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onko_ai"]
