[project]
name = "onko-documents"
version = "0.1.0"
description = "Upload, parsing (docx/pdf) and PDF rendering of clinical documents."
requires-python = ">=3.11"
dependencies = [
    "onko-contracts",
    "onko-repository",
    "pypdf>=6.21.0",
    "typst>=0.15.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onko_documents"]
