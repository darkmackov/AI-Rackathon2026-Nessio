[project]
name = "onko-contracts"
version = "0.1.0"
description = "Shared domain models and API contracts. Every module talks through these."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14.1"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onko_contracts"]
